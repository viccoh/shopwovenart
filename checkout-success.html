<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order confirmed — Shopwovenart</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="site-header"></div>

<div class="wrap success-page">
  <div style="display:flex; justify-content:center; margin-bottom:24px;">
    <svg width="56" height="56" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <rect x="1" y="1" width="38" height="38" rx="2" stroke="#C24B23" stroke-width="2" />
      <rect x="7" y="7" width="26" height="26" rx="2" stroke="#E4A93B" stroke-width="2" />
      <rect x="13" y="13" width="14" height="14" rx="1" stroke="#3E9B93" stroke-width="2" />
      <rect x="17" y="17" width="6" height="6" rx="1" fill="#2C2560" />
    </svg>
  </div>
  <h1 class="font-display">Order confirmed</h1>
  <p>Thank you — your piece is going into our crochet queue. We'll email you a confirmation and reach out with an estimated delivery date.</p>
  <p id="ref-line" class="ref" style="display:none;"></p>
  <a href="shop.html" class="btn btn-clay" style="margin-top:40px;">Continue shopping</a>
</div>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/blogPosts.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script>
  const ref = new URLSearchParams(window.location.search).get("ref");
  if (ref) {
    const el = document.getElementById("ref-line");
    el.textContent = "Payment reference: " + ref;
    el.style.display = "block";
  }
</script>
</body>
</html>
