<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="page-title">Journal — Shopwovenart</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="site-header"></div>

<div id="post-root"></div>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/blogPosts.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script>
  const slug = new URLSearchParams(window.location.search).get("slug");
  const post = window.SW_getPostBySlug(slug);
  const root = document.getElementById("post-root");

  function formatDate(dateStr) {
    return new Date(dateStr).toLocaleDateString("en-NG", { year: "numeric", month: "long", day: "numeric" });
  }

  if (!post) {
    root.innerHTML = `<div class="wrap" style="padding:80px 0; text-align:center;">
      <h1 class="font-display">Post not found</h1>
      <a href="blog.html" class="btn btn-clay" style="margin-top:24px;">Back to journal</a>
    </div>`;
  } else {
    document.getElementById("page-title").textContent = post.title + " — Shopwovenart";
    root.innerHTML = `
      <article class="blog-post">
        <a href="blog.html" class="back">← Back to journal</a>
        <p class="meta">${post.category} · ${formatDate(post.date)}</p>
        <h1 class="font-display">${post.title}</h1>
        ${post.body.map(p => `<p class="body-p">${p}</p>`).join("")}
      </article>`;
  }
</script>
</body>
</html>
