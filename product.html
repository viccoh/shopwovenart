<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="page-title">Product — Shopwovenart</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="site-header"></div>

<div id="product-root" class="wrap"></div>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/blogPosts.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script>
  const slug = new URLSearchParams(window.location.search).get("slug");
  const product = window.SW_getProductBySlug(slug);
  const root = document.getElementById("product-root");

  if (!product) {
    root.innerHTML = `<div style="padding:80px 0; text-align:center;">
      <h1 class="font-display">Product not found</h1>
      <p style="margin:12px 0 24px; color:rgba(43,27,20,0.7);">That item isn't in the catalog.</p>
      <a href="shop.html" class="btn btn-clay">Back to shop</a>
    </div>`;
  } else {
    document.getElementById("page-title").textContent = product.name + " — Shopwovenart";
    let sizeIndex = 0;

    function renderCard(p) {
      const prices = p.sizes.map(s => s.price);
      const min = Math.min(...prices), max = Math.max(...prices);
      const priceLabel = min === max ? swFormatNaira(min) : `${swFormatNaira(min)} – ${swFormatNaira(max)}`;
      return `
        <a href="product.html?slug=${p.slug}" class="product-card">
          <div class="product-card-img"><img src="${p.image}" alt="${p.name}" /></div>
          <p class="cat">${p.category}</p>
          <h3 class="font-display">${p.name}</h3>
          <p class="price">${priceLabel}</p>
        </a>`;
    }

    const related = window.SW_PRODUCTS
      .filter(p => p.category === product.category && p.slug !== product.slug)
      .slice(0, 4);

    function render() {
      const size = product.sizes[sizeIndex];
      root.innerHTML = `
        <div class="pd-grid">
          <div class="pd-img"><img src="${product.image}" alt="${product.name}" /></div>
          <div class="pd-info">
            <p class="cat">${product.category}</p>
            <h1 class="font-display">${product.name}</h1>
            <p class="price font-display">${swFormatNaira(size.price)}</p>
            <p class="desc">${product.description}</p>
            <div style="margin-top:32px;">
              <p style="font-size:14px; font-weight:500; margin-bottom:8px;">Size</p>
              <div class="size-row">
                ${product.sizes.map((s, i) => `
                  <button class="pill ${i === sizeIndex ? "active" : ""}" data-size-index="${i}">${s.label}</button>
                `).join("")}
              </div>
            </div>
            <div class="pd-actions">
              <button id="add-to-bag" class="btn btn-espresso">Add to bag</button>
              <button id="buy-now" class="btn btn-outline">Buy now</button>
            </div>
            ${product.care ? `<p class="care-note"><strong style="color:var(--espresso);">Care: </strong>${product.care}</p>` : ""}
          </div>
        </div>
        ${related.length > 0 ? `
          <div style="margin-top:40px; padding-bottom:56px;">
            <h2 class="font-display" style="font-size:1.5rem; margin-bottom:24px;">You might also like</h2>
            <div class="product-grid">${related.map(renderCard).join("")}</div>
          </div>` : ""}
      `;

      root.querySelectorAll("[data-size-index]").forEach(btn => {
        btn.addEventListener("click", () => {
          sizeIndex = parseInt(btn.dataset.sizeIndex, 10);
          render();
        });
      });

      document.getElementById("add-to-bag").addEventListener("click", (e) => {
        window.SW_Cart.addItem(product, product.sizes[sizeIndex]);
        swUpdateBagBadge();
        e.target.textContent = "Added to bag";
        setTimeout(() => { e.target.textContent = "Add to bag"; }, 2000);
      });

      document.getElementById("buy-now").addEventListener("click", () => {
        window.SW_Cart.addItem(product, product.sizes[sizeIndex]);
        window.location.href = "checkout.html";
      });
    }

    render();
  }
</script>
</body>
</html>
