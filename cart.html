<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your bag — Shopwovenart</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="site-header"></div>

<div id="cart-root" class="wrap" style="padding:56px 0;"></div>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/blogPosts.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script>
  const root = document.getElementById("cart-root");

  function render() {
    const items = window.SW_Cart.getItems();

    if (items.length === 0) {
      root.innerHTML = `
        <div class="cart-empty">
          <h1 class="font-display">Your bag is empty</h1>
          <p>Nothing added yet — have a look through the collection.</p>
          <a href="shop.html" class="btn btn-clay">Shop the collection</a>
        </div>`;
      return;
    }

    const subtotal = window.SW_Cart.subtotal();

    root.innerHTML = `
      <h1 class="font-display" style="font-size:2.5rem; margin-bottom:40px;">Your bag</h1>
      <div class="cart-layout">
        <div id="cart-items">
          ${items.map(item => `
            <div class="cart-item" data-key="${item.key}">
              <img src="${item.image}" alt="${item.name}" />
              <div style="flex:1;">
                <div class="top">
                  <div>
                    <h4>${item.name}</h4>
                    <p class="size">${item.sizeLabel}</p>
                  </div>
                  <p style="white-space:nowrap;">${swFormatNaira(item.price * item.quantity)}</p>
                </div>
                <div class="qty-row">
                  <div class="qty-control">
                    <button data-action="dec" data-key="${item.key}" aria-label="Decrease quantity">−</button>
                    <span>${item.quantity}</span>
                    <button data-action="inc" data-key="${item.key}" aria-label="Increase quantity">+</button>
                  </div>
                  <button class="remove-btn" data-action="remove" data-key="${item.key}">Remove</button>
                </div>
              </div>
            </div>
          `).join("")}
        </div>
        <div class="summary-box">
          <div class="summary-row"><span>Subtotal</span><span>${swFormatNaira(subtotal)}</span></div>
          <p class="summary-note">Shipping and delivery time are confirmed at checkout.</p>
          <a href="checkout.html" class="btn btn-espresso" style="width:100%;">Checkout</a>
        </div>
      </div>`;

    root.querySelectorAll("[data-action]").forEach(btn => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.key;
        const action = btn.dataset.action;
        if (action === "remove") {
          window.SW_Cart.removeItem(key);
        } else {
          const item = window.SW_Cart.getItems().find(i => i.key === key);
          const newQty = action === "inc" ? item.quantity + 1 : item.quantity - 1;
          window.SW_Cart.updateQuantity(key, newQty);
        }
        swUpdateBagBadge();
        render();
      });
    });
  }

  render();
</script>
</body>
</html>
